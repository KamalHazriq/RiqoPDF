name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      # Same env as the Pages deploy, so a build that would break production
      # (basePath, static export) fails here first.
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /RiqoPDF
      # Production deps only, critical only: the remaining high findings live
      # in eslint-config-next's dev-only glob chain and in postcss bundled
      # inside next, and need a next@16 major bump — tracked in SESSION_NOTES.md.
      - run: npm audit --omit=dev --audit-level=critical

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # The route tests exercise the real binaries (Office conversion,
      # compression, OCR, qpdf-backed repair), same set the Dockerfile installs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript libreoffice-writer libreoffice-calc libreoffice-impress \
            qpdf tesseract-ocr tesseract-ocr-eng tesseract-ocr-msa \
            tesseract-ocr-chi-sim tesseract-ocr-jpn
      - run: pip install -r requirements-dev.txt pip-audit
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt
